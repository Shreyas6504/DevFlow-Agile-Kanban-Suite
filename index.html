<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevFlow - Agile Kanban & Productivity Suite</title>
  <meta name="description" content="Production-ready Agile Kanban board with native HTML5 Drag and Drop, Chart.js analytics, LocalStorage persistence, and JSON backup.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- App Header -->
  <header class="navbar navbar-expand-lg border-bottom border-secondary-subtle px-3 py-2 sticky-top glass-navbar">
    <div class="container-fluid px-0">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <span class="brand-icon d-flex align-items-center justify-content-center text-primary">
          <i class="bi bi-kanban fs-4"></i>
        </span>
        <div class="d-flex flex-column">
          <span class="fw-bold text-light tracking-tight">Dev<span class="text-primary">Flow</span></span>
          <small class="text-secondary font-monospace" style="font-size: 0.68rem;">Agile Kanban & Sprint Analytics</small>
        </div>
      </a>

      <!-- Quick Actions -->
      <div class="d-flex align-items-center gap-2 ms-auto">
        <button class="btn btn-outline-info btn-sm d-flex align-items-center gap-1" data-bs-toggle="modal" data-bs-target="#analyticsModal" id="viewAnalyticsBtn">
          <i class="bi bi-graph-up"></i>
          <span class="d-none d-sm-inline">Analytics</span>
        </button>
        <button class="btn btn-outline-secondary btn-sm" id="exportBtn" title="Export tasks to JSON">
          <i class="bi bi-download"></i>
          <span class="d-none d-md-inline ms-1">Export</span>
        </button>
        <label class="btn btn-outline-secondary btn-sm mb-0" title="Import tasks from JSON" style="cursor: pointer;">
          <i class="bi bi-upload"></i>
          <span class="d-none d-md-inline ms-1">Import</span>
          <input type="file" id="importInput" accept=".json" style="display: none;">
        </label>
        <button class="btn btn-primary btn-sm d-flex align-items-center gap-1 fw-bold px-3" data-bs-toggle="modal" data-bs-target="#taskModal" id="addNewTaskBtn">
          <i class="bi bi-plus-lg"></i>
          <span>New Task</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Filter & Search Toolbar -->
  <div class="border-bottom border-secondary-subtle py-2 px-3 bg-dark-subtle">
    <div class="container-fluid px-0">
      <div class="row g-2 align-items-center">
        <!-- Search Box -->
        <div class="col-12 col-md-5 col-lg-4">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-dark border-secondary-subtle text-secondary"><i class="bi bi-search"></i></span>
            <input type="text" id="searchInput" class="form-control bg-dark text-light border-secondary-subtle" placeholder="Search tasks, descriptions, or tags...">
          </div>
        </div>

        <!-- Priority Filter -->
        <div class="col-6 col-md-3 col-lg-3">
          <select id="priorityFilter" class="form-select form-select-sm bg-dark text-light border-secondary-subtle">
            <option value="all">All Priorities</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>

        <!-- Metrics pill summaries -->
        <div class="col-6 col-md-4 col-lg-5 d-flex justify-content-end align-items-center gap-2">
          <span class="badge bg-secondary-subtle text-secondary font-monospace" id="totalTasksBadge">Total: 0</span>
          <span class="badge bg-success-subtle text-success font-monospace" id="completedTasksBadge">Done: 0</span>
          <button class="btn btn-sm btn-link text-secondary text-decoration-none p-0" id="resetDemoBtn" title="Restore sample demo tasks">
            <i class="bi bi-arrow-counterclockwise"></i> <small>Reset Data</small>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Kanban Board Stage -->
  <main class="flex-grow-1 p-3 overflow-x-auto">
    <div class="kanban-board d-flex gap-3 align-items-start pb-3">

      <!-- Column 1: Backlog -->
      <section class="kanban-column rounded border border-secondary-subtle p-2" data-status="backlog">
        <div class="column-header d-flex justify-content-between align-items-center mb-2 px-2 py-1">
          <div class="d-flex align-items-center gap-2">
            <span class="column-dot bg-secondary"></span>
            <h6 class="fw-bold mb-0 text-light small text-uppercase font-monospace">Backlog</h6>
          </div>
          <span class="badge rounded-pill bg-dark border border-secondary-subtle font-monospace count-badge">0</span>
        </div>
        <div class="cards-container d-flex flex-column gap-2" id="backlogColumn"></div>
      </section>

      <!-- Column 2: In Progress -->
      <section class="kanban-column rounded border border-secondary-subtle p-2" data-status="in_progress">
        <div class="column-header d-flex justify-content-between align-items-center mb-2 px-2 py-1">
          <div class="d-flex align-items-center gap-2">
            <span class="column-dot bg-primary"></span>
            <h6 class="fw-bold mb-0 text-light small text-uppercase font-monospace">In Progress</h6>
          </div>
          <span class="badge rounded-pill bg-dark border border-secondary-subtle font-monospace count-badge">0</span>
        </div>
        <div class="cards-container d-flex flex-column gap-2" id="inProgressColumn"></div>
      </section>

      <!-- Column 3: In Review -->
      <section class="kanban-column rounded border border-secondary-subtle p-2" data-status="review">
        <div class="column-header d-flex justify-content-between align-items-center mb-2 px-2 py-1">
          <div class="d-flex align-items-center gap-2">
            <span class="column-dot bg-warning"></span>
            <h6 class="fw-bold mb-0 text-light small text-uppercase font-monospace">Code Review</h6>
          </div>
          <span class="badge rounded-pill bg-dark border border-secondary-subtle font-monospace count-badge">0</span>
        </div>
        <div class="cards-container d-flex flex-column gap-2" id="reviewColumn"></div>
      </section>

      <!-- Column 4: Done -->
      <section class="kanban-column rounded border border-secondary-subtle p-2" data-status="done">
        <div class="column-header d-flex justify-content-between align-items-center mb-2 px-2 py-1">
          <div class="d-flex align-items-center gap-2">
            <span class="column-dot bg-success"></span>
            <h6 class="fw-bold mb-0 text-light small text-uppercase font-monospace">Completed</h6>
          </div>
          <span class="badge rounded-pill bg-dark border border-secondary-subtle font-monospace count-badge">0</span>
        </div>
        <div class="cards-container d-flex flex-column gap-2" id="doneColumn"></div>
      </section>

    </div>
  </main>

  <!-- Create / Edit Task Modal -->
  <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-card border border-secondary-subtle">
        <div class="modal-header border-bottom border-secondary-subtle">
          <h5 class="modal-title fw-bold" id="taskModalLabel">
            <i class="bi bi-pencil-square me-2 text-primary"></i> <span id="modalActionText">Create New Task</span>
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="taskForm">
          <div class="modal-body d-flex flex-column gap-3">
            <input type="hidden" id="taskIdInput">

            <!-- Title -->
            <div>
              <label for="taskTitleInput" class="form-label small fw-semibold text-secondary">Task Title *</label>
              <input type="text" class="form-control bg-dark border-secondary-subtle text-light" id="taskTitleInput" required placeholder="e.g., Integrate OAuth2 authentication">
            </div>

            <!-- Description -->
            <div>
              <label for="taskDescInput" class="form-label small fw-semibold text-secondary">Description</label>
              <textarea class="form-control bg-dark border-secondary-subtle text-light" id="taskDescInput" rows="3" placeholder="Acceptance criteria, notes, or implementation steps..."></textarea>
            </div>

            <!-- Priority & Status Row -->
            <div class="row g-2">
              <div class="col-6">
                <label for="taskPriorityInput" class="form-label small fw-semibold text-secondary">Priority</label>
                <select class="form-select bg-dark border-secondary-subtle text-light" id="taskPriorityInput">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                  <option value="critical">Critical</option>
                </select>
              </div>
              <div class="col-6">
                <label for="taskStatusInput" class="form-label small fw-semibold text-secondary">Column / Stage</label>
                <select class="form-select bg-dark border-secondary-subtle text-light" id="taskStatusInput">
                  <option value="backlog">Backlog</option>
                  <option value="in_progress">In Progress</option>
                  <option value="review">Code Review</option>
                  <option value="done">Completed</option>
                </select>
              </div>
            </div>

            <!-- Due Date & Tags Row -->
            <div class="row g-2">
              <div class="col-6">
                <label for="taskDueDateInput" class="form-label small fw-semibold text-secondary">Due Date</label>
                <input type="date" class="form-control bg-dark border-secondary-subtle text-light" id="taskDueDateInput">
              </div>
              <div class="col-6">
                <label for="taskTagsInput" class="form-label small fw-semibold text-secondary">Tags (comma separated)</label>
                <input type="text" class="form-control bg-dark border-secondary-subtle text-light" id="taskTagsInput" placeholder="frontend, auth, api">
              </div>
            </div>

          </div>
          <div class="modal-footer border-top border-secondary-subtle">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm px-4 fw-bold" id="saveTaskBtn">Save Task</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Analytics & Metrics Modal -->
  <div class="modal fade" id="analyticsModal" tabindex="-1" aria-labelledby="analyticsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content glass-card border border-secondary-subtle">
        <div class="modal-header border-bottom border-secondary-subtle">
          <h5 class="modal-title fw-bold" id="analyticsModalLabel">
            <i class="bi bi-pie-chart-fill me-2 text-info"></i> Sprint Productivity & Analytics
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <div class="row g-4">
            <div class="col-12 col-md-6">
              <h6 class="text-secondary small font-monospace text-uppercase text-center mb-3">Tasks by Status</h6>
              <div style="height: 240px; position: relative;">
                <canvas id="statusChart"></canvas>
              </div>
            </div>
            <div class="col-12 col-md-6">
              <h6 class="text-secondary small font-monospace text-uppercase text-center mb-3">Tasks by Priority</h6>
              <div style="height: 240px; position: relative;">
                <canvas id="priorityChart"></canvas>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer border-top border-secondary-subtle">
          <button type="button" class="btn btn-secondary btn-sm px-3" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
